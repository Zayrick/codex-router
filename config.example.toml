# Codex Router reads all runtime settings and persisted state from this file.
# Copy it to config.toml, protect that file as a secret, and replace placeholders.

[server]
bind = "127.0.0.1:8787"
public_origin = "http://127.0.0.1:8787"
cors_origin = "*"
maintenance_interval_seconds = 300
log_filter = "codex_router=info,tower_http=info"

[admin]
path = "change-this-hidden-path"
secret = "change-this-admin-secret"

[upstream]
# Optional SOCKS5 proxy for ChatGPT HTTP, SSE, and WebSocket connections.
# socks5h resolves upstream hostnames through the proxy.
# chatgpt_proxy = "socks5h://127.0.0.1:1080"
codex_resets_url = "https://codex-resets.com/api/v1/status"

[usage_tracking]
# Relative paths are resolved next to this configuration file.
database_path = "usage.sqlite3"

# Model prices are stored here by the management page. Values are USD per
# one million tokens. The optional multiplier defaults to 1.
# [[usage_tracking.model_prices]]
# model = "gpt-5.4"
# input = 2.5
# output = 15.0
# cacheRead = 0.25
# cacheWrite = 0.0
# multiplier = 1.0

[notifications]
# Event switches default to true when omitted for backward compatibility.
# reset_watch_enabled = true
# quota_reset_enabled = true
# usage_warning_enabled = true
# all_accounts = true
# account_ids = ["00000000-0000-4000-8000-000000000001"]
# bark_enabled = true
# bark_push_url = "https://api.day.app/device-key"
# dingtalk_enabled = true
# dingtalk_webhook_url = "https://oapi.dingtalk.com/robot/send?access_token=access-token"
# dingtalk_secret = "SEC..."

[public_account]
# When enabled, a credential routed to a group can see quota timelines for all
# Codex accounts in that group on the public account page.
show_quota = true

[state]

[[state.api_keys]]
id = "00000000-0000-4000-8000-000000000001"
name = "local"
key = "sk-change-me-123!"
enabled = true

# Account, routing, OAuth, and quota state is managed by the service.
# Token events are stored in SQLite.
