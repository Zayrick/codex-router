# Codex Router reads all runtime settings and persisted state from this file.
# Copy it to config.toml, protect that file as a secret, and replace placeholders.

[server]
bind = "127.0.0.1:8787"
public_origin = "http://127.0.0.1:8787"
cors_origin = "*"
maintenance_interval_seconds = 300
log_filter = "codex_router=info,tower_http=info"

[admin]
path = "change-this-hidden-path"
secret = "change-this-admin-secret"

[upstream]
# ChatGPT upstream is fixed at https://chatgpt.com. Omit this setting for a
# direct connection. socks5h resolves upstream hostnames through the proxy.
# chatgpt_proxy = "socks5h://127.0.0.1:1080"
codex_resets_url = "https://codex-resets.com/api/v1/status"

[usage_tracking]
# Relative paths are resolved next to this configuration file.
database_path = "usage.sqlite3"

# Model prices are stored here by the management page. Values are USD per
# one million tokens. The optional multiplier defaults to 1.
# [[usage_tracking.model_prices]]
# model = "gpt-5.4"
# input = 2.5
# output = 15.0
# cacheRead = 0.25
# cacheWrite = 0.0
# multiplier = 1.0

[notifications]
# bark_push_url = "https://api.day.app/device-key"
# dingtalk_webhook_url = "https://oapi.dingtalk.com/robot/send?access_token=access-token"
# dingtalk_secret = "SEC..."

[state]

[[state.api_keys]]
id = "00000000-0000-4000-8000-000000000001"
name = "local"
key = "sk-change-me-123!"
enabled = true

# OAuth, proxy accounts, proxy OAuth, and subscription usage snapshots are
# written here by the management API and maintenance task. Downstream token
# events are stored in the SQLite database configured above.
