map $http_upgrade $codex_router_front_connection {
    default upgrade;
    '' close;
}

server {
    listen 0.0.0.0:8317;
    server_name _;
    client_max_body_size 128m;
    client_body_timeout 3600s;
    send_timeout 3600s;
    access_log off;
    error_log /var/log/nginx/codex-router-front.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codex_router_front_connection;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_addr:$server_port;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/(?:admin(?:/|$)|management(?:\.html)?(?:/|$)|(?:api|v[0-9]+)/management(?:/|$)) {
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:18317;
    }

    location / {
        proxy_pass http://127.0.0.1:18317;
    }
}
