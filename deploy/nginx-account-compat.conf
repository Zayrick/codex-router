map $http_upgrade $codex_router_connection {
    default upgrade;
    '' close;
}

server {
    listen 0.0.0.0:8318;
    server_name _;
    client_max_body_size 128m;
    client_body_timeout 3600s;
    send_timeout 3600s;
    access_log /var/log/nginx/codex-router-compat.access.log main;
    error_log /var/log/nginx/codex-router-compat.error.log warn;

    location = /healthz {
        proxy_pass http://127.0.0.1:18317;
    }

    location /backend-api/codex/ {
        proxy_pass http://127.0.0.1:18317;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codex_router_connection;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { return 404; }
}
