name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to server after build
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.18.0
          runtime: node@22.12.0
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          package-json-file: frontend/package.json
          install: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target "$TARGET"
          rustup default 1.97.1

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-amd64-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-amd64-rust-1.97.1-

      - name: Build release binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Verify binary
        shell: bash
        run: |
          file "target/$TARGET/release/codex-router"
          "target/$TARGET/release/codex-router" --version

      - name: Package artifact
        shell: bash
        run: |
          package_dir="dist/codex-router-linux-amd64"
          install -D -m 0755 "target/$TARGET/release/codex-router" "$package_dir/codex-router"
          install -D -m 0644 config.example.toml "$package_dir/config.example.toml"
          (
            cd "$package_dir"
            sha256sum codex-router > SHA256SUMS
          )
          tar -C dist -czf dist/codex-router-linux-amd64.tar.gz codex-router-linux-amd64

      - name: Upload Linux amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-router-linux-amd64.tar.gz
          path: dist/codex-router-linux-amd64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to server
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: codex-router-linux-amd64.tar.gz

      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set; trusting host key from ssh-keyscan"
            ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CONFIG
          Host deploy-target
            HostName $SSH_HOST
            Port ${SSH_PORT:-22}
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          CONFIG

      - name: Upload and install
        shell: bash
        run: |
          remote_file="/tmp/codex-router-linux-amd64-${GITHUB_RUN_ID}.tar.gz"
          scp codex-router-linux-amd64.tar.gz "deploy-target:$remote_file"
          ssh deploy-target "sudo -n /usr/local/sbin/codex-router-update '$remote_file'; status=\$?; rm -f '$remote_file'; exit \$status"
