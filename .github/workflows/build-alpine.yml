name: Build Alpine

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Alpine amd64 binary
    runs-on: ubuntu-22.04
    container: rust:1.97.1-alpine3.22
    timeout-minutes: 45

    steps:
      # tar and zstd are required by actions/cache; BusyBox tar is not compatible.
      - name: Install build dependencies
        run: |
          apk add --no-cache nodejs npm tar zstd
          npm install --global pnpm@11.18.0

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target
          key: alpine-amd64-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            alpine-amd64-rust-1.97.1-

      - name: Build release binary
        run: cargo build --locked --release

      - name: Verify binary
        run: |
          binary="target/release/codex-router"
          elf_info=$(readelf --wide --program-headers --dynamic "$binary")
          printf '%s\n' "$elf_info"
          if printf '%s\n' "$elf_info" | grep -Eq '^[[:space:]]*INTERP[[:space:]]|\(NEEDED\)'; then
            echo "::error::Alpine binary has a dynamic interpreter or shared-library dependency."
            exit 1
          fi
          "$binary" --version

      - name: Package artifact
        run: |
          package_dir="dist/codex-router-alpine-amd64"
          install -D -m 0755 target/release/codex-router "$package_dir/codex-router"
          install -D -m 0644 config.example.toml "$package_dir/config.example.toml"
          (
            cd "$package_dir"
            sha256sum codex-router > SHA256SUMS
          )
          tar -C dist -czf dist/codex-router-alpine-amd64.tar.gz codex-router-alpine-amd64

      - name: Upload Alpine amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-router-alpine-amd64.tar.gz
          path: dist/codex-router-alpine-amd64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
